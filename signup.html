<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign Up | What's Your GPA?</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid&family=Maiden+Orange&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="auth.css">
	<script type="module" src="script.js"></script>
</head>
<body class="auth-page">
	<main class="auth-shell">
		<section class="auth-card">
			<p class="auth-eyebrow">What's Your GPA?</p>
			<h1>Sign Up</h1>
			<form class="auth-form" data-auth-form="signup">
				<label>
					<span>Name</span>
					<input type="text" name="name" autocomplete="name" />
				</label>
				<label>
					<span>Email</span>
					<input type="email" name="email" autocomplete="email" required />
				</label>
				<label>
					<span>Password</span>
					<input type="password" name="password" autocomplete="new-password" required />
				</label>
				<button type="submit">Create Account</button>
				<p class="auth-status" data-auth-status></p>
			</form>
			<p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
			<p class="auth-switch"><a href="index.html">Back home</a></p>
		</section>
	</main>
</body>
</html>
